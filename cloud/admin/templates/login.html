<!doctype html>
<html lang="en">

  <title>GDG Tulsa Admin</title>
  <link rel="stylesheet" href="/static/admin.css">

<body class="login-page">

    <p class="eyebrow">GDG Tulsa</p>

    </p>
  </main>
