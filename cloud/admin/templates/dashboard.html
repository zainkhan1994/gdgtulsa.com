<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>GDG Tulsa Private Admin</title>
  <link rel="stylesheet" href="/static/admin.css">
  <script type="module" src="/static/admin.js"></script>
</head>
<body class="dashboard-page">
  <header class="admin-header">
    <div>
      <p class="eyebrow">GDG Tulsa</p>
      <h1>Private Admin</h1>
    </div>

    <button
      type="button"
      class="secondary-button"
      data-admin-signout
    >
      Sign out
    </button>
  </header>

  <main class="dashboard-shell">
    <section class="placeholder-card">
      <h2>Protected dashboard shell</h2>

      <p>
        Server-side admin authentication is active here.
        The existing dashboard will be migrated only after
        this security boundary is verified.
      </p>
    </section>
  </main>
</body>
</html>
