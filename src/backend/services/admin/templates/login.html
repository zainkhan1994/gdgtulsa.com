<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>GDG Tulsa Admin</title>
  <link rel="stylesheet" href="/static/admin.css">
  <script type="module" src="/static/admin.js"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
          <circle cx="7" cy="8" r="3.1" fill="#4285f4"></circle>
          <circle cx="16.5" cy="8" r="3.1" fill="#ea4335"></circle>
          <circle cx="7" cy="16" r="3.1" fill="#34a853"></circle>
          <circle cx="16.5" cy="16" r="3.1" fill="#fbbc04"></circle>
        </svg>
      </span>
      <p class="eyebrow">GDG Tulsa</p>
    </div>

    <h1>Admin Portal</h1>

    <p>
      This application is restricted to approved GDG Tulsa administrators.
    </p>

    <button
      type="button"
      class="primary-button"
      data-google-login
    >
      Continue with Google
    </button>

    <p class="status" data-auth-status>
      Approved administrator accounts only.
    </p>
  </main>
</body>
</html>
